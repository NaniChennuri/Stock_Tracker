<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hanuman Enterprises</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- ── TOKEN SETUP SCREEN ── -->
<div id="screen-token" class="screen">
  <div class="auth-card">
    <div class="auth-logo">Hanuman <span>Enterprises</span></div>


    <input class="auth-input" id="token-input" type="password" placeholder="Please paste your token here..." autocomplete="off"/>

    <button class="auth-btn" id="token-btn" onclick="submitToken()">Connect</button>
    <div class="auth-error" id="token-error"></div>
  </div>
</div>

<!-- ── PIN SCREEN ── -->
<div id="screen-pin" class="screen">
  <div class="auth-card">
    <div class="auth-logo">Hanuman <span>Enterprises</span></div>
    <div class="auth-sub">Enter your PIN to continue</div>

    <div class="pin-dots">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>
    <div class="pin-error" id="pin-error">Incorrect PIN. Try again.</div>

    <div class="pin-pad">
      <div class="pin-key" onclick="pinPress('1')">1</div>
      <div class="pin-key" onclick="pinPress('2')">2</div>
      <div class="pin-key" onclick="pinPress('3')">3</div>
      <div class="pin-key" onclick="pinPress('4')">4</div>
      <div class="pin-key" onclick="pinPress('5')">5</div>
      <div class="pin-key" onclick="pinPress('6')">6</div>
      <div class="pin-key" onclick="pinPress('7')">7</div>
      <div class="pin-key" onclick="pinPress('8')">8</div>
      <div class="pin-key" onclick="pinPress('9')">9</div>
      <div class="pin-key empty"></div>
      <div class="pin-key" onclick="pinPress('0')">0</div>
      <div class="pin-key del" onclick="pinPress('del')">⌫</div>
    </div>

    <div class="pin-reset" onclick="resetToken()">Use a different token</div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div id="screen-app">
  <div id="topbar">
    <div class="tb-brand">Hanuman <span>Enterprises</span></div>
    <button class="tb-icon-btn" title="Save" onclick="saveAll()">💾</button>
  </div>
  <div id="app-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
